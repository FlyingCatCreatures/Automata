plugins {
    id 'java'
    id 'application'
}

group = 'com.flyingCatMan.automata'
version = '1.0'

application {
    mainClass = 'automata.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('run') {
    standardInput = System.in
}

tasks.named('test', Test) {
    useJUnitPlatform()

    testLogging {
        events "passed"
    }
}
